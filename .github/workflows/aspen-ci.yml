name: ASPEN CI

on:

  workflow_dispatch:

    inputs:

      version:

        description: "ASPEN image version"

        required: true

        default: "0.1.0"


  push:

    branches:

      - main


# ============================================================
# GLOBAL SETTINGS
# ============================================================

env:

  IMAGE_NAME: aspen

  QUAY_REGISTRY: rogers-registry-opp-ldc-poc-quay-openshift-operators.apps.opp-ldc-cl-01.rpc.ren.rogers.com

  QUAY_IMAGE: rogers-registry-opp-ldc-poc-quay-openshift-operators.apps.opp-ldc-cl-01.rpc.ren.rogers.com/batch_ops/aspen


# ============================================================
# ASPEN BUILD
# ============================================================

jobs:

  build:

    runs-on:

      - self-hosted

      - aspen

      - podman


    permissions:

      contents: read


    steps:


      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout ASPEN

        uses: actions/checkout@v4


      # ======================================================
      # RUNNER INFORMATION
      # ======================================================

      - name: Runner information

        shell: bash

        run: |

          set -euo pipefail

          echo "ASPEN CI"
          echo "========"

          echo "Commit : ${GITHUB_SHA}"
          echo "Branch : ${GITHUB_REF_NAME}"
          echo "Runner : ${RUNNER_NAME}"

          echo

          python --version

          podman --version


      # ======================================================
      # PYTHON VALIDATION
      # ======================================================

      - name: Compile ASPEN

        shell: bash

        run: |

          set -euo pipefail

          python -m compileall \
            app \
            scripts


      # ======================================================
      # DETERMINE IMAGE VERSION
      #
      # Manual workflow:
      #
      #     0.1.0
      #
      # Normal main push:
      #
      #     Git commit SHA
      # ======================================================

      - name: Determine image tag

        id: image

        shell: bash

        run: |

          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then

              IMAGE_TAG="${{ github.event.inputs.version }}"

          else

              IMAGE_TAG="${GITHUB_SHA}"

          fi


          echo "tag=${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"


          echo
          echo "ASPEN image:"
          echo "${QUAY_IMAGE}:${IMAGE_TAG}"


      # ======================================================
      # BUILD CONTAINER
      # ======================================================

      - name: Build ASPEN container

        shell: bash

        run: |

          set -euo pipefail

          podman build \
            --pull \
            -f Containerfile \
            -t "${QUAY_IMAGE}:${{ steps.image.outputs.tag }}" \
            .


      # ======================================================
      # CONTAINER DEPENDENCY VALIDATION
      # ======================================================

      - name: Validate container dependencies

        shell: bash

        run: |

          set -euo pipefail

          podman run \
            --rm \
            --entrypoint python \
            "${QUAY_IMAGE}:${{ steps.image.outputs.tag }}" \
            -c "import fastapi, sqlalchemy, psycopg, jinja2, pwdlib; print('ASPEN container dependencies OK')"


      # ======================================================
      # ASPEN APPLICATION IMPORT TEST
      #
      # This validates that the packaged application imports.
      # It does NOT connect to PostgreSQL.
      # ======================================================

      - name: Validate ASPEN application

        shell: bash

        run: |

          set -euo pipefail

          podman run \
            --rm \
            -e VSR_DATABASE_URL="postgresql+psycopg://test:test@localhost:5432/test" \
            -e VSR_SESSION_SECRET="github-build-validation-only" \
            -e VSR_LOCAL_AUTH_ENABLED="true" \
            -e VSR_SESSION_IDLE_MINUTES="120" \
            --entrypoint python \
            "${QUAY_IMAGE}:${{ steps.image.outputs.tag }}" \
            -c "from app.main import app; print('ASPEN application import OK')"


      # ======================================================
      # VALIDATE QUAY SECRETS
      #
      # Values are intentionally never displayed.
      # ======================================================

      - name: Validate Quay credentials

        shell: bash

        env:

          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}

          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}

        run: |

          set -euo pipefail


          if [ -z "${QUAY_USERNAME}" ]; then

              echo "ERROR: QUAY_USERNAME secret is not configured."

              exit 1

          fi


          if [ -z "${QUAY_TOKEN}" ]; then

              echo "ERROR: QUAY_TOKEN secret is not configured."

              exit 1

          fi


          echo "Quay credentials are configured."


      # ======================================================
      # QUAY LOGIN
      # ======================================================

      - name: Login to Red Hat Quay

        shell: bash

        env:

          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}

          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}

        run: |

          set -euo pipefail


          printf '%s' "${QUAY_TOKEN}" |

            podman login \
              --username "${QUAY_USERNAME}" \
              --password-stdin \
              "${QUAY_REGISTRY}"


      # ======================================================
      # PUSH IMAGE
      # ======================================================

      - name: Push ASPEN image

        shell: bash

        run: |

          set -euo pipefail


          echo "Pushing ASPEN image:"

          echo "${QUAY_IMAGE}:${{ steps.image.outputs.tag }}"


          podman push \
            "${QUAY_IMAGE}:${{ steps.image.outputs.tag }}"


      # ======================================================
      # BUILD SUMMARY
      # ======================================================

      - name: ASPEN build summary

        shell: bash

        run: |

          set -euo pipefail


          echo
          echo "ASPEN CI completed successfully."
          echo
          echo "Image:"
          echo "${QUAY_IMAGE}:${{ steps.image.outputs.tag }}"


      # ======================================================
      # QUAY LOGOUT
      # ======================================================

      - name: Logout from Red Hat Quay

        if: always()

        shell: bash

        run: |

          podman logout \
            "${QUAY_REGISTRY}" \
            || true
