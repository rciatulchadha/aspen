
name: ASPEN CI


# ============================================================
# TRIGGERS
#
# Normal push:
#   Build only when application/container code changes.
#
# GitOps-only changes under gitops/** do NOT build another
# container image.
#
# workflow_dispatch:
#   Used to create an explicit release tag such as 0.1.10.
# ============================================================

on:

  workflow_dispatch:

    inputs:

      version:

        description: "ASPEN image version"

        required: true

        default: "0.1.10"


  push:

    branches:

      - main

    paths:

      - "app/**"

      - "scripts/**"

      - "requirements.txt"

      - "Containerfile"

      - ".github/workflows/aspen-ci.yml"


# ============================================================
# GLOBAL SETTINGS
# ============================================================

env:

  QUAY_REGISTRY: rogers-registry-opp-ldc-poc-quay-openshift-operators.apps.opp-ldc-cl-01.rpc.ren.rogers.com

  QUAY_IMAGE: rogers-registry-opp-ldc-poc-quay-openshift-operators.apps.opp-ldc-cl-01.rpc.ren.rogers.com/batch_ops/aspen


# ============================================================
# ASPEN BUILD
# ============================================================

jobs:

  build:

    runs-on:

      - self-hosted

      - aspen

      - podman


    permissions:

      contents: read


    steps:


      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout ASPEN

        uses: actions/checkout@v4


      # ======================================================
      # RUNNER INFORMATION
      # ======================================================

      - name: Runner information

        shell: bash

        run: |

          set -euo pipefail

          echo
          echo "============================================"
          echo "ASPEN CI"
          echo "============================================"
          echo

          echo "Commit : ${GITHUB_SHA}"
          echo "Branch : ${GITHUB_REF_NAME}"
          echo "Runner : ${RUNNER_NAME}"

          echo
          echo "Podman:"
          podman --version

          echo
          echo "Filesystem:"
          df -h "${HOME}" || true

          echo
          echo "Podman storage:"
          podman system df || true


      # ======================================================
      # PYTHON SOURCE VALIDATION
      #
      # This only checks Python source syntax using whatever
      # Python is available on the Runner.
      #
      # Full dependency/import tests happen inside the
      # finished ASPEN container.
      # ======================================================

      - name: Compile ASPEN source

        shell: bash

        run: |

          set -euo pipefail

          python3 -m compileall \
            app \
            scripts


      # ======================================================
      # DETERMINE IMAGE TAG
      #
      # workflow_dispatch:
      #
      #   Uses explicit release version.
      #
      #   Example:
      #
      #       0.1.10
      #
      # push:
      #
      #   Uses immutable Git commit SHA.
      # ======================================================

      - name: Determine image tag

        id: image

        shell: bash

        run: |

          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then

              IMAGE_TAG="${{ github.event.inputs.version }}"

          else

              IMAGE_TAG="${GITHUB_SHA}"

          fi


          if [ -z "${IMAGE_TAG}" ]; then

              echo "ERROR: Unable to determine ASPEN image tag."

              exit 1

          fi


          echo "tag=${IMAGE_TAG}" \
            >> "${GITHUB_OUTPUT}"


          echo
          echo "ASPEN image:"
          echo "${QUAY_IMAGE}:${IMAGE_TAG}"


      # ======================================================
      # PRE-BUILD CLEANUP
      #
      # Remove dangling data before starting a large multi-
      # stage build. This is important on the self-hosted
      # Runner because Podman storage persists across jobs.
      # ======================================================

      - name: Prepare Podman storage

        shell: bash

        run: |

          set -euo pipefail

          echo
          echo "Podman storage before cleanup:"

          podman system df || true


          podman container prune \
            --force \
            || true


          podman image prune \
            --force \
            || true


          echo
          echo "Podman storage after cleanup:"

          podman system df || true


          echo
          echo "Filesystem:"

          df -h "${HOME}" || true


      # ======================================================
      # BUILD ASPEN
      #
      # Current architecture:
      #
      # Builder:
      #   Red Hat UBI 10 Python 3.12 Minimal
      #
      # Runtime:
      #   Red Hat UBI 10 Micro
      # ======================================================

      - name: Build ASPEN container

        shell: bash

        run: |

          set -euo pipefail

          podman build \
            --pull \
            -f Containerfile \
            -t "${QUAY_IMAGE}:${{ steps.image.outputs.tag }}" \
            .


      # ======================================================
      # VERIFY PYTHON RUNTIME
      #
      # ASPEN intentionally uses:
      #
      #     /usr/bin/python3.12
      #
      # Do not use:
      #
      #     python
      # ======================================================

      - name: Validate Python runtime

        shell: bash

        run: |

          set -euo pipefail

          podman run \
            --rm \
            --entrypoint /usr/bin/python3.12 \
            "${QUAY_IMAGE}:${{ steps.image.outputs.tag }}" \
            -c "import sys; print('ASPEN Python runtime:', sys.version)"


      # ======================================================
      # DEPENDENCY VALIDATION
      # ======================================================

      - name: Validate ASPEN dependencies

        shell: bash

        run: |

          set -euo pipefail

          podman run \
            --rm \
            --entrypoint /usr/bin/python3.12 \
            "${QUAY_IMAGE}:${{ steps.image.outputs.tag }}" \
            -c "import fastapi, sqlalchemy, psycopg, jinja2, pwdlib, argon2; print('ASPEN container dependencies OK')"


      # ======================================================
      # APPLICATION IMPORT VALIDATION
      #
      # Synthetic database configuration is sufficient here.
      #
      # We are validating that ASPEN and all route modules can
      # import successfully from the finished image.
      # ======================================================

      - name: Validate ASPEN application

        shell: bash

        run: |

          set -euo pipefail

          podman run \
            --rm \
            -e VSR_DATABASE_URL="postgresql+psycopg://test:test@localhost:5432/test" \
            -e VSR_SESSION_SECRET="github-build-validation-only" \
            -e VSR_LOCAL_AUTH_ENABLED="true" \
            -e VSR_SESSION_IDLE_MINUTES="120" \
            --entrypoint /usr/bin/python3.12 \
            "${QUAY_IMAGE}:${{ steps.image.outputs.tag }}" \
            -c "from app.main import app; print('ASPEN application import OK')"


      # ======================================================
      # ENVIRONMENT CONFIGURATION VALIDATION
      #
      # Prevent old ASPEN environments from silently returning
      # in a future build.
      # ======================================================

      - name: Validate ASPEN environments

        shell: bash

        run: |

          set -euo pipefail

          podman run \
            --rm \
            --entrypoint /usr/bin/python3.12 \
            "${QUAY_IMAGE}:${{ steps.image.outputs.tag }}" \
            -c "from app.environments import ASPEN_ENVIRONMENTS; assert ASPEN_ENVIRONMENTS == ['Maestro', 'V21', 'SDM']; print('ASPEN environments:', ASPEN_ENVIRONMENTS)"


      # ======================================================
      # QUAY CREDENTIAL VALIDATION
      #
      # Repository secrets:
      #
      #   QUAY_USERNAME
      #   QUAY_TOKEN
      # ======================================================

      - name: Validate Quay credentials

        shell: bash

        env:

          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}

          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}

        run: |

          set -euo pipefail


          if [ -z "${QUAY_USERNAME}" ]; then

              echo "ERROR: QUAY_USERNAME secret is not configured."

              exit 1

          fi


          if [ -z "${QUAY_TOKEN}" ]; then

              echo "ERROR: QUAY_TOKEN secret is not configured."

              exit 1

          fi


          echo "Quay credentials are configured."


      # ======================================================
      # QUAY LOGIN
      # ======================================================

      - name: Login to Red Hat Quay

        shell: bash

        env:

          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}

          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}

        run: |

          set -euo pipefail


          printf '%s' "${QUAY_TOKEN}" |

            podman login \
              --username "${QUAY_USERNAME}" \
              --password-stdin \
              "${QUAY_REGISTRY}"


      # ======================================================
      # PUSH ASPEN IMAGE
      # ======================================================

      - name: Push ASPEN image

        shell: bash

        run: |

          set -euo pipefail

          IMAGE="${QUAY_IMAGE}:${{ steps.image.outputs.tag }}"


          echo
          echo "Pushing ASPEN image:"
          echo "${IMAGE}"
          echo


          podman push \
            "${IMAGE}"


      # ======================================================
      # BUILD SUMMARY
      # ======================================================

      - name: ASPEN build summary

        shell: bash

        run: |

          set -euo pipefail

          echo
          echo "============================================"
          echo "ASPEN CI completed successfully"
          echo "============================================"
          echo

          echo "Image:"
          echo "${QUAY_IMAGE}:${{ steps.image.outputs.tag }}"

          echo
          echo "Commit:"
          echo "${GITHUB_SHA}"

          echo
          echo "Runtime:"
          echo "Red Hat UBI 10 Micro / Python 3.12"


      # ======================================================
      # QUAY LOGOUT
      # ======================================================

      - name: Logout from Red Hat Quay

        if: always()

        shell: bash

        run: |

          podman logout \
            "${QUAY_REGISTRY}" \
            || true


      # ======================================================
      # CLEANUP LOCAL ASPEN CI IMAGE
      #
      # Quay owns the persistent image after push.
      #
      # The self-hosted Runner should NOT retain:
      #
      #   aspen:<Git SHA>
      #
      # or locally generated release images.
      #
      # This prevents Podman storage from growing after every
      # workflow execution.
      # ======================================================

      - name: Cleanup ASPEN CI image

        if: always()

        shell: bash

        run: |

          set +e

          IMAGE="${QUAY_IMAGE}:${{ steps.image.outputs.tag }}"


          echo
          echo "============================================"
          echo "ASPEN Runner Cleanup"
          echo "============================================"
          echo

          echo "Image built by workflow:"
          echo "${IMAGE}"

          echo
          echo "Podman storage before cleanup:"

          podman system df || true


          echo
          echo "Removing local ASPEN CI image..."

          podman rmi \
            "${IMAGE}" \
            || true


          echo
          echo "Removing stopped containers..."

          podman container prune \
            --force \
            || true


          echo
          echo "Removing dangling images..."

          podman image prune \
            --force \
            || true


          echo
          echo "Podman storage after cleanup:"

          podman system df || true


          echo
          echo "Filesystem after cleanup:"

          df -h "${HOME}" || true


          echo
          echo "ASPEN Runner cleanup completed."
