name: ASPEN CI


# ============================================================
# TRIGGERS
# ============================================================

on:

  workflow_dispatch:

    inputs:

      version:

        description: "ASPEN image version"

        required: true

        default: "0.1.4"


  push:

    branches:

      - main


# ============================================================
# GLOBAL SETTINGS
# ============================================================

env:

  QUAY_REGISTRY: rogers-registry-opp-ldc-poc-quay-openshift-operators.apps.opp-ldc-cl-01.rpc.ren.rogers.com

  QUAY_IMAGE: rogers-registry-opp-ldc-poc-quay-openshift-operators.apps.opp-ldc-cl-01.rpc.ren.rogers.com/batch_ops/aspen


# ============================================================
# ASPEN BUILD
# ============================================================

jobs:

  build:

    runs-on:

      - self-hosted

      - aspen

      - podman


    permissions:

      contents: read


    steps:


      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout ASPEN

        uses: actions/checkout@v4


      # ======================================================
      # RUNNER INFORMATION
      # ======================================================

      - name: Runner information

        shell: bash

        run: |

          set -euo pipefail

          echo "ASPEN CI"
          echo "========"
          echo
          echo "Commit : ${GITHUB_SHA}"
          echo "Branch : ${GITHUB_REF_NAME}"
          echo "Runner : ${RUNNER_NAME}"
          echo
          echo "Podman:"
          podman --version


      # ======================================================
      # PYTHON SOURCE VALIDATION
      #
      # This validates the ASPEN source with the Python
      # installed on the GitHub Runner.
      # ======================================================

      - name: Compile ASPEN source

        shell: bash

        run: |

          set -euo pipefail

          python3 -m compileall \
            app \
            scripts


      # ======================================================
      # DETERMINE IMAGE TAG
      #
      # workflow_dispatch:
      #
      #     User supplied release version
      #     Example: 0.1.4
      #
      # push to main:
      #
      #     Git commit SHA
      # ======================================================

      - name: Determine image tag

        id: image

        shell: bash

        run: |

          set -euo pipefail


          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then

              IMAGE_TAG="${{ github.event.inputs.version }}"

          else

              IMAGE_TAG="${GITHUB_SHA}"

          fi


          if [ -z "${IMAGE_TAG}" ]; then

              echo "ERROR: Unable to determine image tag."

              exit 1

          fi


          echo "tag=${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"


          echo
          echo "ASPEN image:"
          echo "${QUAY_IMAGE}:${IMAGE_TAG}"


      # ======================================================
      # BUILD ASPEN
      #
      # Containerfile currently builds:
      #
      #   Red Hat UBI 10
      #   Python 3.12
      #   UBI Micro runtime
      # ======================================================

      - name: Build ASPEN container

        shell: bash

        run: |

          set -euo pipefail

          podman build \
            --pull \
            -f Containerfile \
            -t "${QUAY_IMAGE}:${{ steps.image.outputs.tag }}" \
            .


      # ======================================================
      # VERIFY PYTHON RUNTIME
      #
      # Do not use:
      #
      #     --entrypoint python
      #
      # ASPEN UBI Micro intentionally contains:
      #
      #     /usr/bin/python3.12
      # ======================================================

      - name: Validate Python runtime

        shell: bash

        run: |

          set -euo pipefail

          podman run \
            --rm \
            --entrypoint /usr/bin/python3.12 \
            "${QUAY_IMAGE}:${{ steps.image.outputs.tag }}" \
            -c "import sys; print('ASPEN Python runtime:', sys.version)"


      # ======================================================
      # DEPENDENCY VALIDATION
      # ======================================================

      - name: Validate ASPEN dependencies

        shell: bash

        run: |

          set -euo pipefail

          podman run \
            --rm \
            --entrypoint /usr/bin/python3.12 \
            "${QUAY_IMAGE}:${{ steps.image.outputs.tag }}" \
            -c "import fastapi, sqlalchemy, psycopg, jinja2, pwdlib, argon2; print('ASPEN container dependencies OK')"


      # ======================================================
      # APPLICATION IMPORT VALIDATION
      #
      # The database URL is deliberately synthetic.
      #
      # This test confirms the packaged ASPEN application can
      # import. It does not require the production database.
      # ======================================================

      - name: Validate ASPEN application

        shell: bash

        run: |

          set -euo pipefail

          podman run \
            --rm \
            -e VSR_DATABASE_URL="postgresql+psycopg://test:test@localhost:5432/test" \
            -e VSR_SESSION_SECRET="github-build-validation-only" \
            -e VSR_LOCAL_AUTH_ENABLED="true" \
            -e VSR_SESSION_IDLE_MINUTES="120" \
            --entrypoint /usr/bin/python3.12 \
            "${QUAY_IMAGE}:${{ steps.image.outputs.tag }}" \
            -c "from app.main import app; print('ASPEN application import OK')"


      # ======================================================
      # VALIDATE QUAY CREDENTIALS
      #
      # GitHub repository secrets required:
      #
      #     QUAY_USERNAME
      #     QUAY_TOKEN
      #
      # Values are intentionally never displayed.
      # ======================================================

      - name: Validate Quay credentials

        shell: bash

        env:

          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}

          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}

        run: |

          set -euo pipefail


          if [ -z "${QUAY_USERNAME}" ]; then

              echo "ERROR: QUAY_USERNAME secret is not configured."

              exit 1

          fi


          if [ -z "${QUAY_TOKEN}" ]; then

              echo "ERROR: QUAY_TOKEN secret is not configured."

              exit 1

          fi


          echo "Quay credentials are configured."


      # ======================================================
      # QUAY LOGIN
      # ======================================================

      - name: Login to Red Hat Quay

        shell: bash

        env:

          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}

          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}

        run: |

          set -euo pipefail


          printf '%s' "${QUAY_TOKEN}" |

            podman login \
              --username "${QUAY_USERNAME}" \
              --password-stdin \
              "${QUAY_REGISTRY}"


      # ======================================================
      # PUSH ASPEN IMAGE
      # ======================================================

      - name: Push ASPEN image

        shell: bash

        run: |

          set -euo pipefail


          echo
          echo "Pushing ASPEN image:"
          echo "${QUAY_IMAGE}:${{ steps.image.outputs.tag }}"
          echo


          podman push \
            "${QUAY_IMAGE}:${{ steps.image.outputs.tag }}"


      # ======================================================
      # BUILD SUMMARY
      # ======================================================

      - name: ASPEN build summary

        shell: bash

        run: |

          set -euo pipefail


          echo
          echo "============================================"
          echo "ASPEN CI completed successfully"
          echo "============================================"
          echo
          echo "Image:"
          echo "${QUAY_IMAGE}:${{ steps.image.outputs.tag }}"
          echo
          echo "Commit:"
          echo "${GITHUB_SHA}"
          echo
          echo "Runtime:"
          echo "Red Hat UBI 10 Micro / Python 3.12"
          echo


      # ======================================================
      # QUAY LOGOUT
      # ======================================================

      - name: Logout from Red Hat Quay

        if: always()

        shell: bash

        run: |

          podman logout \
            "${QUAY_REGISTRY}" \
            || true


      # ======================================================
      # LOCAL RUNNER CLEANUP
      #
      # Self-hosted runners retain Podman build layers.
      # Cleaning dangling data prevents the ASPEN runner disk
      # from filling up after repeated builds.
      # ======================================================

      - name: Cleanup Podman build artifacts

        if: always()

        shell: bash

        run: |

          echo "Podman disk usage before cleanup:"

          podman system df || true


          echo
          echo "Removing dangling images and stopped containers..."

          podman image prune \
            --force \
            || true

          podman container prune \
            --force \
            || true


          echo
          echo "Podman disk usage after cleanup:"

          podman system df || true
