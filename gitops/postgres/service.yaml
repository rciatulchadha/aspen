apiVersion: v1
kind: Service

metadata:
  name: vsr-postgresql
  namespace: aspen

  labels:
    app: vsr-postgresql

spec:

  type: ClusterIP

  selector:
    name: vsr-postgresql

  ports:

    - name: postgresql
      port: 5432
      targetPort: 5432
      protocol: TCP

  sessionAffinity: None
